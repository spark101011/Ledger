<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>P&L Desk — Trade Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1117">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0D1117;
    --card: #151B23;
    --card-2: #1B222C;
    --border: #262E39;
    --profit: #3EC17F;
    --profit-dim: #1E4A34;
    --loss: #E0604D;
    --loss-dim: #4A2621;
    --gold: #D9A94E;
    --text: #ECEAE3;
    --muted: #838C99;
    --muted-2: #5B636F;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 0%, rgba(217,169,78,0.05), transparent 40%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    padding-bottom: 6rem;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    padding: 1.5rem 1.15rem 1.1rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(13, 17, 23, 0.9);
    backdrop-filter: blur(10px);
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .logo {
    width: 34px; height: 34px;
    flex-shrink: 0;
  }

  .brand-text h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.35rem;
    margin: 0;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .brand-text span {
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .header-stats {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .pill {
    padding: 0.4rem 0.75rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--card);
  }
  .pill.pos { color: var(--profit); border-color: var(--profit-dim); }
  .pill.neg { color: var(--loss); border-color: var(--loss-dim); }
  .pill.locked { color: var(--loss); border-color: var(--loss); background: var(--loss-dim); font-weight: 600; }

  /* ---------- Tabs ---------- */
  nav.tabs {
    display: flex;
    gap: 0.4rem;
    padding: 0 1.15rem;
    margin-top: 1.1rem;
    overflow-x: auto;
  }
  .tab {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    padding: 0.55rem 0.1rem;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    margin-right: 1.1rem;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--gold); }

  main { padding: 1.15rem; max-width: 640px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Cards / generic ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem;
    margin-bottom: 0.9rem;
  }
  .card h2 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 1rem;
    margin: 0 0 0.9rem;
    color: var(--text);
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.7rem;
  }
  .stat {
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.8rem 0.9rem;
  }
  .stat .label { font-size: 0.66rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .stat .value { font-size: 1.25rem; font-weight: 600; margin-top: 0.25rem; }
  .stat .value.pos { color: var(--profit); }
  .stat .value.neg { color: var(--loss); }
  .stat .sub { font-size: 0.68rem; color: var(--muted-2); margin-top: 0.15rem; }

  /* ---------- Equity curve ---------- */
  .chart-wrap { position: relative; }
  svg.equity { width: 100%; height: 150px; display: block; }
  .chart-meta { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--muted); margin-top: 0.4rem; }

  /* ---------- Strategy breakdown ---------- */
  .strategy-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
  }
  .strategy-row:last-child { border-bottom: none; }
  .strategy-name { font-weight: 600; }
  .strategy-bar-bg {
    background: var(--card-2);
    border-radius: 4px;
    height: 5px;
    width: 100%;
    margin-top: 0.35rem;
    overflow: hidden;
  }
  .strategy-bar { height: 100%; background: var(--gold); }
  .strategy-meta { font-size: 0.68rem; color: var(--muted); margin-top: 0.3rem; }

  /* ---------- Calendar ---------- */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.9rem;
  }
  .cal-nav-btn {
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 30px; height: 30px;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .cal-title { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 1.05rem; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-dow {
    font-size: 0.6rem;
    color: var(--muted-2);
    text-align: center;
    padding-bottom: 0.3rem;
    letter-spacing: 0.05em;
  }
  .cal-day {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    cursor: pointer;
    position: relative;
  }
  .cal-day.empty { border: none; background: none; cursor: default; }
  .cal-day .d-num { color: var(--muted); }
  .cal-day .d-pnl { font-size: 0.58rem; font-weight: 600; margin-top: 2px; }
  .cal-day.today { border-color: var(--gold); }
  .cal-day.pos { background: var(--profit-dim); }
  .cal-day.pos .d-pnl { color: var(--profit); }
  .cal-day.neg { background: var(--loss-dim); }
  .cal-day.neg .d-pnl { color: var(--loss); }
  .cal-day.selected { outline: 2px solid var(--gold); outline-offset: -2px; }

  /* Day view */
  .day-view-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.9rem;
  }
  .back-link {
    background: none; border: none; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem;
    cursor: pointer; padding: 0;
  }

  .trade-item {
    background: var(--card-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--muted-2);
    border-radius: 6px;
    padding: 0.75rem 0.9rem;
    margin-bottom: 0.6rem;
  }
  .trade-item.pos { border-left-color: var(--profit); }
  .trade-item.neg { border-left-color: var(--loss); }
  .trade-top { display: flex; justify-content: space-between; align-items: baseline; }
  .trade-strategy { font-weight: 600; font-size: 0.82rem; }
  .trade-pnl { font-weight: 700; font-size: 0.9rem; }
  .trade-pnl.pos { color: var(--profit); }
  .trade-pnl.neg { color: var(--loss); }
  .trade-sub { font-size: 0.68rem; color: var(--muted); margin-top: 0.3rem; }
  .trade-notes { font-size: 0.73rem; color: var(--muted); margin-top: 0.4rem; line-height: 1.4; font-style: italic; }

  .empty-state { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 2rem 1rem; line-height: 1.6; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    bottom: 1.4rem;
    right: 1.4rem;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--gold);
    color: #14110A;
    border: none;
    font-size: 1.6rem;
    font-weight: 700;
    box-shadow: 0 6px 20px rgba(217,169,78,0.35);
    cursor: pointer;
    z-index: 30;
  }
  .fab.locked { background: var(--loss); color: white; box-shadow: 0 6px 20px rgba(224,96,77,0.35); }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    z-index: 40;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 1.4rem 1.2rem 2rem;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    margin: 0 0 1rem;
  }
  .field { margin-bottom: 0.9rem; }
  .field label {
    display: block;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.88rem;
    padding: 0.65rem 0.75rem;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }

  .btn {
    width: 100%;
    padding: 0.85rem;
    border-radius: 10px;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    margin-top: 0.4rem;
  }
  .btn-primary { background: var(--gold); color: #14110A; }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--muted); }
  .btn:disabled { opacity: 0.4; }

  .locked-banner {
    background: var(--loss-dim);
    border: 1px solid var(--loss);
    color: var(--loss);
    border-radius: 8px;
    padding: 0.9rem;
    font-size: 0.78rem;
    text-align: center;
    line-height: 1.5;
  }

  .footer-links {
    display: flex;
    justify-content: center;
    gap: 1.2rem;
    padding: 1.5rem 0 0;
  }
  .footer-links button {
    background: none; border: none; color: var(--muted-2);
    font-size: 0.68rem; letter-spacing: 0.04em;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer; text-decoration: underline;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" fill="none">
      <rect x="1" y="1" width="38" height="38" rx="9" stroke="#D9A94E" stroke-width="1.4"/>
      <rect x="9" y="21" width="5" height="11" rx="1" fill="#E0604D"/>
      <rect x="17.5" y="14" width="5" height="18" rx="1" fill="#3EC17F"/>
      <rect x="26" y="8" width="5" height="24" rx="1" fill="#D9A94E"/>
    </svg>
    <div class="brand-text">
      <h1>P&amp;L Desk</h1>
      <span>Trade Ledger</span>
    </div>
  </div>
  <div class="header-stats" id="headerStats"></div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="overview">Overview</button>
  <button class="tab" data-tab="calendar">Calendar</button>
  <button class="tab" data-tab="strategies">Strategies</button>
</nav>

<main>

  <!-- OVERVIEW -->
  <section class="view active" id="view-overview">
    <div class="card">
      <h2>Equity Curve</h2>
      <div class="chart-wrap">
        <svg class="equity" id="equitySvg" viewBox="0 0 300 150" preserveAspectRatio="none"></svg>
      </div>
      <div class="chart-meta">
        <span id="eqStart">Start —</span>
        <span id="eqNow">Now —</span>
      </div>
    </div>

    <div class="card">
      <h2>Performance</h2>
      <div class="stat-grid">
        <div class="stat">
          <div class="label">Total P&amp;L (EV)</div>
          <div class="value" id="statTotalPnl">$0</div>
        </div>
        <div class="stat">
          <div class="label">Win Rate</div>
          <div class="value" id="statWinRate">0%</div>
        </div>
        <div class="stat">
          <div class="label">Avg R (winners)</div>
          <div class="value" id="statAvgR">0R</div>
        </div>
        <div class="stat">
          <div class="label">Streak</div>
          <div class="value" id="statStreak">—</div>
          <div class="sub" id="statLongest">longest: —</div>
        </div>
      </div>
    </div>
  </section>

  <!-- CALENDAR -->
  <section class="view" id="view-calendar">
    <div class="card" id="calMonthCard">
      <div class="cal-header">
        <button class="cal-nav-btn" id="calPrev">‹</button>
        <div class="cal-title" id="calTitle">—</div>
        <button class="cal-nav-btn" id="calNext">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="card" id="dayViewCard" style="display:none;">
      <div class="day-view-header">
        <button class="back-link" id="backToMonth">‹ Back to month</button>
      </div>
      <h2 id="dayViewTitle">—</h2>
      <div id="dayTradesList"></div>
    </div>
  </section>

  <!-- STRATEGIES -->
  <section class="view" id="view-strategies">
    <div class="card">
      <h2>By Strategy</h2>
      <div id="strategyList"></div>
    </div>
  </section>

</main>

<button class="fab" id="fabAdd">+</button>

<!-- New Trade Modal -->
<div class="modal-backdrop" id="tradeModalBackdrop">
  <div class="modal">
    <h3>New Trade</h3>
    <div id="lockedNotice"></div>
    <form id="tradeForm">
      <div class="field">
        <label>Date</label>
        <input type="date" id="fDate" required>
      </div>
      <div class="field">
        <label>Strategy</label>
        <input type="text" id="fStrategy" list="strategyOptions" placeholder="e.g. Breakout, Scalp, Reversal" required>
        <datalist id="strategyOptions"></datalist>
      </div>
      <div class="row-2">
        <div class="field">
          <label>P&amp;L ($)</label>
          <input type="number" step="0.01" id="fPnl" placeholder="e.g. 45 or -20" required>
        </div>
        <div class="field">
          <label>Risk ($)</label>
          <input type="number" step="0.01" id="fRisk" placeholder="e.g. 20" required>
        </div>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="fNotes" placeholder="What was the setup / lesson?"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" id="submitTradeBtn">Log Trade</button>
      <button type="button" class="btn btn-ghost" id="cancelTradeBtn">Cancel</button>
    </form>
  </div>
</div>

<!-- Settings Modal (onboarding + edit) -->
<div class="modal-backdrop" id="settingsModalBackdrop">
  <div class="modal">
    <h3>Account Setup</h3>
    <div class="field">
      <label>Starting Balance ($)</label>
      <input type="number" step="0.01" id="sBalance" placeholder="e.g. 1000">
    </div>
    <div class="field">
      <label>Daily Risk Limit ($)</label>
      <input type="number" step="0.01" id="sLimit" placeholder="e.g. 50">
    </div>
    <button class="btn btn-primary" id="saveSettingsBtn">Save</button>
  </div>
</div>

<div class="footer-links">
  <button id="editSettingsLink">Account settings</button>
  <button id="exportBtn">Export backup</button>
  <button id="importBtn">Import backup</button>
</div>
<input type="file" id="importFile" accept="application/json" style="display:none;">

<script>
/* ======================= DATA LAYER ======================= */
const STORAGE_KEY = 'pnlDeskData';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { startingBalance: null, dailyLimit: null, trades: [] };
    return JSON.parse(raw);
  } catch (e) {
    return { startingBalance: null, dailyLimit: null, trades: [] };
  }
}
function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
let DATA = loadData();

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function fmtMoney(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toFixed(2);
}

/* ======================= ONBOARDING ======================= */
function checkOnboarding() {
  if (DATA.startingBalance == null || DATA.dailyLimit == null) {
    document.getElementById('settingsModalBackdrop').classList.add('open');
  }
}
document.getElementById('saveSettingsBtn').addEventListener('click', () => {
  const bal = parseFloat(document.getElementById('sBalance').value);
  const lim = parseFloat(document.getElementById('sLimit').value);
  if (isNaN(bal) || isNaN(lim)) { alert('Enter both values'); return; }
  DATA.startingBalance = bal;
  DATA.dailyLimit = lim;
  saveData(DATA);
  document.getElementById('settingsModalBackdrop').classList.remove('open');
  renderAll();
});
document.getElementById('editSettingsLink').addEventListener('click', () => {
  document.getElementById('sBalance').value = DATA.startingBalance ?? '';
  document.getElementById('sLimit').value = DATA.dailyLimit ?? '';
  document.getElementById('settingsModalBackdrop').classList.add('open');
});

/* ======================= TABS ======================= */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
  });
});

/* ======================= COMPUTATIONS ======================= */
function pnlForDate(dateStr) {
  return DATA.trades.filter(t => t.date === dateStr).reduce((s, t) => s + t.pnl, 0);
}
function tradesForDate(dateStr) {
  return DATA.trades.filter(t => t.date === dateStr).sort((a,b) => a.timestamp - b.timestamp);
}
function isLockedForDate(dateStr) {
  if (!DATA.dailyLimit) return false;
  return pnlForDate(dateStr) <= -Math.abs(DATA.dailyLimit);
}
function totalPnl() {
  return DATA.trades.reduce((s, t) => s + t.pnl, 0);
}
function winRate() {
  if (!DATA.trades.length) return 0;
  const wins = DATA.trades.filter(t => t.pnl > 0).length;
  return Math.round((wins / DATA.trades.length) * 100);
}
function avgR() {
  const winners = DATA.trades.filter(t => t.pnl > 0 && t.risk > 0);
  if (!winners.length) return 0;
  const total = winners.reduce((s, t) => s + (t.pnl / t.risk), 0);
  return (total / winners.length).toFixed(2);
}
function streaks() {
  const sorted = [...DATA.trades].sort((a,b) => a.timestamp - b.timestamp);
  let current = 0, currentType = null, longest = 0, longestType = null;
  let runType = null, runLen = 0;
  for (const t of sorted) {
    const type = t.pnl >= 0 ? 'W' : 'L';
    if (type === runType) { runLen++; } else { runType = type; runLen = 1; }
    if (runLen > longest) { longest = runLen; longestType = runType; }
  }
  if (sorted.length) {
    currentType = sorted[sorted.length - 1].pnl >= 0 ? 'W' : 'L';
    current = 1;
    for (let i = sorted.length - 2; i >= 0; i--) {
      const type = sorted[i].pnl >= 0 ? 'W' : 'L';
      if (type === currentType) current++; else break;
    }
  }
  return { current, currentType, longest, longestType };
}
function strategyStats() {
  const map = {};
  DATA.trades.forEach(t => {
    if (!map[t.strategy]) map[t.strategy] = { count: 0, wins: 0, pnl: 0 };
    map[t.strategy].count++;
    if (t.pnl > 0) map[t.strategy].wins++;
    map[t.strategy].pnl += t.pnl;
  });
  return Object.entries(map).map(([name, s]) => ({
    name, count: s.count, pnl: s.pnl,
    winRate: Math.round((s.wins / s.count) * 100)
  })).sort((a,b) => b.pnl - a.pnl);
}
function equityPoints() {
  const sorted = [...DATA.trades].sort((a,b) => a.timestamp - b.timestamp);
  let bal = DATA.startingBalance || 0;
  const points = [bal];
  sorted.forEach(t => { bal += t.pnl; points.push(bal); });
  return points;
}

/* ======================= RENDER: HEADER ======================= */
function renderHeader() {
  const today = todayStr();
  const todayPnl = pnlForDate(today);
  const locked = isLockedForDate(today);
  const el = document.getElementById('headerStats');
  el.innerHTML = '';

  const pill1 = document.createElement('div');
  pill1.className = 'pill ' + (todayPnl > 0 ? 'pos' : todayPnl < 0 ? 'neg' : '');
  pill1.textContent = "Today: " + fmtMoney(todayPnl);
  el.appendChild(pill1);

  const bal = (DATA.startingBalance || 0) + totalPnl();
  const pill2 = document.createElement('div');
  pill2.className = 'pill';
  pill2.textContent = "Balance: " + fmtMoney(bal);
  el.appendChild(pill2);

  if (locked) {
    const pill3 = document.createElement('div');
    pill3.className = 'pill locked';
    pill3.textContent = "🔒 Daily limit hit";
    el.appendChild(pill3);
  }

  const fab = document.getElementById('fabAdd');
  fab.classList.toggle('locked', locked);
}

/* ======================= RENDER: OVERVIEW ======================= */
function renderOverview() {
  document.getElementById('statTotalPnl').textContent = fmtMoney(totalPnl());
  document.getElementById('statTotalPnl').className = 'value ' + (totalPnl() >= 0 ? 'pos' : 'neg');
  document.getElementById('statWinRate').textContent = winRate() + '%';
  document.getElementById('statAvgR').textContent = avgR() + 'R';

  const s = streaks();
  document.getElementById('statStreak').textContent = s.current ? s.current + (s.currentType === 'W' ? 'W' : 'L') : '—';
  document.getElementById('statStreak').className = 'value ' + (s.currentType === 'W' ? 'pos' : s.currentType === 'L' ? 'neg' : '');
  document.getElementById('statLongest').textContent = s.longest ? 'longest: ' + s.longest + (s.longestType === 'W' ? 'W' : 'L') : 'longest: —';

  // Equity curve
  const points = equityPoints();
  const svg = document.getElementById('equitySvg');
  if (points.length < 2) {
    svg.innerHTML = '<text x="150" y="75" text-anchor="middle" fill="#5B636F" font-size="10" font-family="IBM Plex Mono">Log trades to see your curve</text>';
    document.getElementById('eqStart').textContent = 'Start: ' + fmtMoney(DATA.startingBalance || 0);
    document.getElementById('eqNow').textContent = 'Now: ' + fmtMoney((DATA.startingBalance||0) + totalPnl());
    return;
  }
  const min = Math.min(...points), max = Math.max(...points);
  const range = (max - min) || 1;
  const w = 300, h = 150, pad = 8;
  const stepX = (w - pad*2) / (points.length - 1);
  const coords = points.map((p, i) => {
    const x = pad + i * stepX;
    const y = pad + (h - pad*2) * (1 - (p - min) / range);
    return [x, y];
  });
  const pathD = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L${coords[coords.length-1][0].toFixed(1)},${h} L${coords[0][0].toFixed(1)},${h} Z`;
  const lineColor = points[points.length-1] >= points[0] ? '#3EC17F' : '#E0604D';
  svg.innerHTML = `
    <defs>
      <linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${lineColor}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${lineColor}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaD}" fill="url(#eqGrad)" stroke="none"/>
    <path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  `;
  document.getElementById('eqStart').textContent = 'Start: ' + fmtMoney(points[0]);
  document.getElementById('eqNow').textContent = 'Now: ' + fmtMoney(points[points.length-1]);
}

/* ======================= RENDER: STRATEGIES ======================= */
function renderStrategies() {
  const list = strategyStats();
  const el = document.getElementById('strategyList');
  if (!list.length) {
    el.innerHTML = '<div class="empty-state">No trades logged yet.</div>';
    return;
  }
  const maxAbs = Math.max(...list.map(s => Math.abs(s.pnl)), 1);
  el.innerHTML = list.map(s => `
    <div class="strategy-row" style="display:block;">
      <div style="display:flex; justify-content:space-between;">
        <span class="strategy-name">${escapeHtml(s.name)}</span>
        <span class="${s.pnl >= 0 ? 'trade-pnl pos' : 'trade-pnl neg'}">${fmtMoney(s.pnl)}</span>
      </div>
      <div class="strategy-bar-bg"><div class="strategy-bar" style="width:${Math.min(100, Math.abs(s.pnl)/maxAbs*100)}%; background:${s.pnl>=0?'#3EC17F':'#E0604D'};"></div></div>
      <div class="strategy-meta">${s.count} trade${s.count===1?'':'s'} · ${s.winRate}% win rate</div>
    </div>
  `).join('');
}

/* ======================= RENDER: CALENDAR ======================= */
let calYear, calMonth; // 0-indexed month
let selectedDate = null;

function initCalendar() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
}
function renderCalendar() {
  document.getElementById('calMonthCard').style.display = selectedDate ? 'none' : 'block';
  document.getElementById('dayViewCard').style.display = selectedDate ? 'block' : 'none';
  if (selectedDate) { renderDayView(); return; }

  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('calTitle').textContent = monthNames[calMonth] + ' ' + calYear;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['S','M','T','W','T','F','S'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = todayStr();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const pnl = pnlForDate(dateStr);
    const hasTrades = DATA.trades.some(t => t.date === dateStr);
    const el = document.createElement('div');
    el.className = 'cal-day' + (dateStr === today ? ' today' : '') + (hasTrades ? (pnl >= 0 ? ' pos' : ' neg') : '');
    el.innerHTML = `<div class="d-num">${day}</div>` + (hasTrades ? `<div class="d-pnl">${fmtMoney(pnl)}</div>` : '');
    el.addEventListener('click', () => { selectedDate = dateStr; renderCalendar(); });
    grid.appendChild(el);
  }
}
function renderDayView() {
  const d = new Date(selectedDate + 'T00:00:00');
  const opts = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
  document.getElementById('dayViewTitle').textContent = d.toLocaleDateString('en-US', opts) + ' — ' + fmtMoney(pnlForDate(selectedDate));

  const trades = tradesForDate(selectedDate);
  const list = document.getElementById('dayTradesList');
  if (!trades.length) {
    list.innerHTML = '<div class="empty-state">No trades logged this day.</div>';
    return;
  }
  list.innerHTML = trades.map(t => `
    <div class="trade-item ${t.pnl >= 0 ? 'pos' : 'neg'}">
      <div class="trade-top">
        <span class="trade-strategy">${escapeHtml(t.strategy)}</span>
        <span class="trade-pnl ${t.pnl >= 0 ? 'pos' : 'neg'}">${fmtMoney(t.pnl)}</span>
      </div>
      <div class="trade-sub">Risk: ${fmtMoney(t.risk)} · R: ${(t.pnl / t.risk).toFixed(2)}</div>
      ${t.notes ? `<div class="trade-notes">"${escapeHtml(t.notes)}"</div>` : ''}
    </div>
  `).join('');
}
document.getElementById('calPrev').addEventListener('click', () => {
  calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});
document.getElementById('calNext').addEventListener('click', () => {
  calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});
document.getElementById('backToMonth').addEventListener('click', () => {
  selectedDate = null; renderCalendar();
});

/* ======================= NEW TRADE MODAL ======================= */
const tradeBackdrop = document.getElementById('tradeModalBackdrop');
document.getElementById('fabAdd').addEventListener('click', () => {
  const today = todayStr();
  document.getElementById('fDate').value = selectedDate || today;
  document.getElementById('fStrategy').value = '';
  document.getElementById('fPnl').value = '';
  document.getElementById('fRisk').value = '';
  document.getElementById('fNotes').value = '';

  const strategies = [...new Set(DATA.trades.map(t => t.strategy))];
  document.getElementById('strategyOptions').innerHTML = strategies.map(s => `<option value="${escapeHtml(s)}">`).join('');

  const checkDate = document.getElementById('fDate').value;
  const locked = isLockedForDate(checkDate);
  const notice = document.getElementById('lockedNotice');
  const submitBtn = document.getElementById('submitTradeBtn');
  if (locked) {
    notice.innerHTML = `<div class="locked-banner">🔒 Daily risk limit already hit for this date. Logging is locked — no more trades today.</div>`;
    submitBtn.disabled = true;
  } else {
    notice.innerHTML = '';
    submitBtn.disabled = false;
  }
  tradeBackdrop.classList.add('open');
});
document.getElementById('cancelTradeBtn').addEventListener('click', () => tradeBackdrop.classList.remove('open'));

document.getElementById('fDate').addEventListener('change', (e) => {
  const locked = isLockedForDate(e.target.value);
  const notice = document.getElementById('lockedNotice');
  const submitBtn = document.getElementById('submitTradeBtn');
  if (locked) {
    notice.innerHTML = `<div class="locked-banner">🔒 Daily risk limit already hit for this date. Logging is locked.</div>`;
    submitBtn.disabled = true;
  } else {
    notice.innerHTML = '';
    submitBtn.disabled = false;
  }
});

document.getElementById('tradeForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const date = document.getElementById('fDate').value;
  if (isLockedForDate(date)) return;
  const trade = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    date,
    strategy: document.getElementById('fStrategy').value.trim() || 'Unnamed',
    pnl: parseFloat(document.getElementById('fPnl').value),
    risk: parseFloat(document.getElementById('fRisk').value),
    notes: document.getElementById('fNotes').value.trim(),
    timestamp: Date.now()
  };
  DATA.trades.push(trade);
  saveData(DATA);
  tradeBackdrop.classList.remove('open');
  renderAll();
});

/* ======================= BACKUP ======================= */
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pnl-desk-backup-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.trades) throw new Error('bad format');
      DATA = parsed;
      saveData(DATA);
      renderAll();
      alert('Backup restored.');
    } catch (err) {
      alert('Could not read that backup file.');
    }
  };
  reader.readAsText(file);
});

/* ======================= UTIL ======================= */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ======================= INIT ======================= */
function renderAll() {
  renderHeader();
  renderOverview();
  renderCalendar();
  renderStrategies();
}
initCalendar();
checkOnboarding();
renderAll();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

</script>
