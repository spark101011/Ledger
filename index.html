<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ledger</title>
<meta name="theme-color" content="#1a1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1a1512;
    --bg-deep: #120e0c;
    --glass: rgba(76, 54, 38, 0.34);
    --glass-hi: rgba(255,255,255,0.03);
    --glass-border: rgba(216, 190, 155, 0.13);
    --green: #62775a;
    --green-bright: #75906b;
    --green-dim: #3a4634;
    --tan: #b3875e;
    --tan-deep: #6e4e30;
    --clay: #a8664c;
    --clay-dim: #5c3a2c;
    --text: #f1e9dc;
    --text-muted: #a99a88;
    --text-faint: #756455;
    --shadow: 0 6px 22px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background:
      radial-gradient(circle at 15% 0%, rgba(110,78,48,0.10), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(98,119,90,0.05), transparent 40%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 84px; }

  header.top { padding: 28px 20px 14px; }
  header.top .brand { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; letter-spacing: 0.2px; }
  header.top .sub { color: var(--text-faint); font-size: 13px; margin-top: 2px; }

  main { flex: 1; padding: 0 16px; }
  .view { display: none; animation: fade .25s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px);} to {opacity:1; transform: translateY(0);} }

  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    backdrop-filter: blur(18px) saturate(108%);
    -webkit-backdrop-filter: blur(18px) saturate(108%);
    box-shadow: var(--shadow);
    padding: 18px;
  }
  .stack { display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }

  /* --- Add view --- */
  .type-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .type-toggle button {
    flex: 1; padding: 11px; border-radius: 14px; border: 1px solid var(--glass-border);
    background: transparent; color: var(--text-muted); font-size: 14px; font-weight: 500;
    font-family: inherit; cursor: pointer; transition: all .18s ease;
  }
  .type-toggle button.active.spend { background: rgba(168,102,76,0.28); color: var(--text); border-color: rgba(168,102,76,0.55); }
  .type-toggle button.active.income { background: rgba(98,119,90,0.22); color: var(--text); border-color: rgba(98,119,90,0.5); }

  label.field-label { display:block; font-size: 12px; color: var(--text-faint); margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  input[type=text], input[type=number], input[type=date] {
    width: 100%; padding: 13px 14px; border-radius: 13px; border: 1px solid var(--glass-border);
    background: rgba(0,0,0,0.18); color: var(--text); font-family: inherit; font-size: 16px;
    outline: none; transition: border-color .15s ease;
  }
  input:focus { border-color: var(--tan); }
  input[type=number] { font-family: 'Fraunces', serif; font-size: 22px; }
  ::-webkit-calendar-picker-indicator { filter: invert(0.8) sepia(0.3); cursor: pointer; }

  .save-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: none; margin-top: 4px;
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; color: #f1e9dc;
    background: var(--tan-deep); transition: transform .12s ease;
  }
  .save-btn:active { transform: scale(0.98); }
  .save-btn.income-mode { background: var(--green-dim); }

  .section-label { font-size: 12px; text-transform: none; color: var(--text-faint); margin: 22px 4px 10px; letter-spacing: .3px; }

  .entry-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; margin-bottom: 8px;
    background: rgba(0,0,0,0.14); border: 1px solid rgba(255,255,255,0.05); }
  .entry-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .entry-dot.spend { background: var(--clay); }
  .entry-dot.income { background: var(--green-bright); }
  .entry-mid { flex: 1; min-width: 0; }
  .entry-name { font-size: 14.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-date { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }
  .entry-amt { font-family: 'Fraunces', serif; font-size: 15.5px; flex-shrink: 0; }
  .entry-amt.spend { color: var(--clay); }
  .entry-amt.income { color: var(--green); }
  .entry-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn { width: 28px; height: 28px; border-radius: 8px; border: none; background: rgba(255,255,255,0.05);
    color: var(--text-faint); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn:active { background: rgba(255,255,255,0.12); }
  .empty-note { text-align: center; color: var(--text-faint); font-size: 13.5px; padding: 30px 10px; }

  /* --- Calendar view --- */
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .month-nav .m-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500; }
  .nav-arrow { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04);
    color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-wd { text-align: center; font-size: 10.5px; color: var(--text-faint); padding-bottom: 6px; }
  .cal-day { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.14); border: 1px solid transparent; cursor: pointer; position: relative; }
  .cal-day.empty { background: transparent; cursor: default; }
  .cal-day .dnum { font-size: 12.5px; color: var(--text-muted); }
  .cal-day.has-activity .dnum { color: var(--text); }
  .cal-day.today { border-color: var(--tan); }
  .cal-day.selected { border-color: var(--green-bright); background: rgba(124,155,114,0.14); }
  .cal-dot-row { display: flex; gap: 2px; margin-top: 2px; }
  .cal-mini-dot { width: 4px; height: 4px; border-radius: 50%; }
  .day-panel { margin-top: 16px; }
  .day-panel .dp-title { font-size: 13px; color: var(--text-faint); margin-bottom: 10px; }

  /* --- Split view --- */
  .hero-num { font-family: 'Fraunces', serif; font-size: 40px; font-weight: 500; line-height: 1; margin: 6px 0 2px; }
  .hero-label { font-size: 12.5px; color: var(--text-faint); }
  .donut-wrap { display: flex; align-items: center; gap: 20px; margin: 18px 0 6px; }
  .donut { width: 128px; height: 128px; border-radius: 50%; flex-shrink: 0; }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 9px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend-sw { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .legend-name { flex: 1; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend-pct { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .split-toggle { display: flex; gap: 8px; margin-bottom: 4px; }
  .split-toggle button { flex:1; padding: 9px; border-radius: 12px; border: 1px solid var(--glass-border); background: transparent;
    color: var(--text-faint); font-family: inherit; font-size: 13px; cursor: pointer; }
  .split-toggle button.active { color: var(--text); background: rgba(255,255,255,0.06); }

  /* --- Compare view --- */
  .compare-grid { display: flex; flex-direction: column; gap: 10px; }
  .compare-row { display: flex; align-items: center; gap: 12px; }
  .compare-label { width: 96px; font-size: 12.5px; color: var(--text-faint); flex-shrink: 0; }
  .compare-bars { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .cbar-track { height: 9px; border-radius: 5px; background: rgba(255,255,255,0.05); overflow: hidden; }
  .cbar-fill { height: 100%; border-radius: 5px; }
  .cbar-fill.spend { background: var(--clay); }
  .cbar-fill.income { background: var(--green); }
  .compare-net { width: 78px; text-align: right; font-family: 'Fraunces', serif; font-size: 14px; flex-shrink: 0; }
  .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 14px 0; }

  /* --- Month summary strip (split view) --- */
  .m-title.tappable { cursor: pointer; text-decoration: underline; text-decoration-color: rgba(230,210,180,0.25); text-underline-offset: 4px; }
  .month-summary { display: flex; gap: 10px; margin-bottom: 16px; }
  .ms-item { flex: 1; text-align: center; padding: 10px 4px; border-radius: 12px; background: rgba(0,0,0,0.14); }
  .ms-label { font-size: 10.5px; color: var(--text-faint); margin-bottom: 3px; }
  .ms-val { font-family: 'Fraunces', serif; font-size: 15px; }

  /* --- Month/year picker --- */
  .picker-year-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
  .picker-year-nav .py-val { font-family: 'Fraunces', serif; font-size: 17px; min-width: 54px; text-align: center; }
  .picker-months { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .picker-month-btn { padding: 12px 4px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.14);
    color: var(--text-muted); font-family: inherit; font-size: 13px; cursor: pointer; }
  .picker-month-btn.current { border-color: var(--tan); color: var(--text); background: rgba(179,135,94,0.16); }

  /* --- Legend tap-through + name detail --- */
  .legend-row.clickable { cursor: pointer; padding: 3px 4px; margin: -3px -4px; border-radius: 8px; transition: background .12s ease; }
  .legend-row.clickable:active { background: rgba(255,255,255,0.06); }
  .nd-stat-block { margin-bottom: 16px; }
  .nd-stat-block .nd-heading { font-size: 12px; color: var(--text-faint); margin-bottom: 8px; }
  .nd-row { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .nd-row:last-child { border-bottom: none; }
  .nd-row .nd-k { font-size: 13px; color: var(--text-muted); }
  .nd-row .nd-v { font-family: 'Fraunces', serif; font-size: 15px; }

  /* --- Wrapped button + overlay --- */
  .wrapped-btn {
    width: 100%; margin-top: 16px; padding: 12px; border-radius: 14px; border: 1px solid var(--glass-border);
    background: rgba(179,135,94,0.10); color: var(--text); font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .wrapped-overlay {
    position: fixed; inset: 0; z-index: 80; display: none; flex-direction: column;
    background: var(--bg-deep);
  }
  .wrapped-overlay.open { display: flex; }
  .wrapped-dots { display: flex; gap: 5px; padding: 14px 18px 0; }
  .wrapped-dots .wd { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.14); overflow: hidden; }
  .wrapped-dots .wd .wd-fill { height: 100%; width: 0%; background: var(--tan); }
  .wrapped-dots .wd.done .wd-fill { width: 100%; }
  .wrapped-close { position: absolute; top: 14px; right: 16px; width: 32px; height: 32px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.08); color: var(--text); font-size: 16px; z-index: 5; }
  .wrapped-slide { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 30px; position: relative; }
  .wrapped-slide .ws-label { font-size: 13px; color: var(--text-faint); letter-spacing: .3px; margin-bottom: 10px; }
  .wrapped-slide .ws-num { font-family: 'Fraunces', serif; font-size: 44px; line-height: 1.1; }
  .wrapped-slide .ws-sub { font-size: 14px; color: var(--text-muted); margin-top: 12px; max-width: 280px; }
  .wrapped-slide .ws-name { font-family: 'Fraunces', serif; font-size: 28px; margin-top: 4px; }
  .wrapped-tap-zones { position: absolute; inset: 0; display: flex; }
  .wrapped-tap-zones div { flex: 1; }

  /* --- Curve view --- */
  .curve-svg { width: 100%; height: 180px; }

  /* --- Nav bar --- */
  nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg-deep) 60%, transparent);
  }
  .tabbar-inner {
    display: flex; gap: 4px; max-width: 448px; width: 100%;
    background: rgba(30, 23, 18, 0.75); border: 1px solid var(--glass-border);
    border-radius: 20px; padding: 6px; backdrop-filter: blur(20px);
  }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0;
    border: none; background: transparent; color: var(--text-faint); border-radius: 15px; cursor: pointer; }
  .tab-btn svg { width: 19px; height: 19px; }
  .tab-btn span { font-size: 9.5px; }
  .tab-btn.active { color: var(--tan); background: rgba(255,255,255,0.05); }

  /* --- Modal --- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(10,8,6,0.6); backdrop-filter: blur(3px);
    display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-backdrop.open { display: flex; }
  .modal-sheet { width: 100%; max-width: 480px; background: #221a15; border-top-left-radius: 24px; border-top-right-radius: 24px;
    border: 1px solid var(--glass-border); padding: 22px 20px calc(26px + env(safe-area-inset-bottom)); }
  .modal-sheet .m-head { font-family: 'Fraunces', serif; font-size: 18px; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions .save-btn { margin-top: 0; }
  .cancel-btn { flex: 1; padding: 14px; border-radius: 14px; border: 1px solid var(--glass-border); background: transparent;
    color: var(--text-muted); font-family: inherit; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Ledger</div>
    <div class="sub" id="headerSub">every cedi, in and out</div>
  </header>

  <main>
    <!-- ADD VIEW -->
    <section class="view active" id="view-add">
      <div class="glass">
        <div class="type-toggle">
          <button id="toggleSpend" class="active spend">Spend</button>
          <button id="toggleIncome" class="income">Income</button>
        </div>
        <div class="field">
          <label class="field-label">Amount</label>
          <input type="number" inputmode="decimal" id="inAmount" placeholder="0.00">
        </div>
        <div class="field">
          <label class="field-label">What was it for</label>
          <input type="text" id="inName" placeholder="e.g. fuel, groceries, freelance job">
        </div>
        <div class="field">
          <label class="field-label">Date</label>
          <input type="date" id="inDate">
        </div>
        <button class="save-btn" id="saveEntryBtn">Add spend</button>
      </div>

      <div class="section-label">Recent</div>
      <div id="recentList"></div>
    </section>

    <!-- CALENDAR VIEW -->
    <section class="view" id="view-calendar">
      <div class="glass">
        <div class="month-nav">
          <div class="nav-arrow" id="calPrev">‹</div>
          <div class="m-title tappable" id="calTitle"></div>
          <div class="nav-arrow" id="calNext">›</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="day-panel" id="dayPanel" style="display:none;">
        <div class="dp-title" id="dpTitle"></div>
        <div id="dpList"></div>
      </div>
    </section>

    <!-- SPLIT VIEW -->
    <section class="view" id="view-split">
      <div class="glass">
        <div class="split-toggle" style="margin-bottom:16px;">
          <button id="scopeMonth" class="active">This month</button>
          <button id="scopeAll">All time</button>
        </div>
        <div class="month-nav" id="splitMonthNav">
          <div class="nav-arrow" id="splitPrev">‹</div>
          <div class="m-title tappable" id="splitTitle"></div>
          <div class="nav-arrow" id="splitNext">›</div>
        </div>
        <div class="month-summary" id="monthSummary"></div>
        <div class="split-toggle">
          <button id="splitToggleSpend" class="active">Spend</button>
          <button id="splitToggleIncome">Income</button>
        </div>
        <div class="hero-label" id="splitTotalLabel">Total this month</div>
        <div class="hero-num" id="splitTotal">0</div>
        <div class="donut-wrap">
          <div class="donut" id="donutEl"></div>
          <div class="legend" id="legendEl"></div>
        </div>
        <button class="wrapped-btn" id="openWrapped">✨ See your Wrapped</button>
      </div>
      <div class="section-label" id="monthListLabel">Everything logged this month</div>
      <div id="monthList"></div>
    </section>

    <!-- COMPARE VIEW -->
    <section class="view" id="view-compare">
      <div class="glass">
        <div class="hero-label">Net position, this month</div>
        <div class="hero-num" id="compareHeroNet">0</div>
        <div class="divider"></div>
        <div class="compare-grid" id="compareGrid"></div>
      </div>
    </section>

    <!-- CURVE VIEW -->
    <section class="view" id="view-curve">
      <div class="glass">
        <div class="hero-label">Current balance</div>
        <div class="hero-num" id="curveHeroNet">0</div>
        <svg class="curve-svg" id="curveSvg" viewBox="0 0 340 180" preserveAspectRatio="none"></svg>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab-btn active" data-view="add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add</span>
      </button>
      <button class="tab-btn" data-view="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
        <span>Calendar</span>
      </button>
      <button class="tab-btn" data-view="split">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9l7.5 4.3A9 9 0 1 0 12 21"/><path d="M12 3a9 9 0 0 1 9 9h-9z"/></svg>
        <span>Split</span>
      </button>
      <button class="tab-btn" data-view="compare">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
        <span>Compare</span>
      </button>
      <button class="tab-btn" data-view="curve">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 6-8"/></svg>
        <span>Curve</span>
      </button>
    </div>
  </nav>
</div>

<div class="modal-backdrop" id="editModal">
  <div class="modal-sheet">
    <div class="m-head">Edit entry</div>
    <div class="field">
      <label class="field-label">Amount</label>
      <input type="number" inputmode="decimal" id="editAmount">
    </div>
    <div class="field">
      <label class="field-label">What was it for</label>
      <input type="text" id="editName">
    </div>
    <div class="field">
      <label class="field-label">Date</label>
      <input type="date" id="editDate">
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" id="editCancel">Cancel</button>
      <button class="save-btn" id="editSave" style="flex:1;">Save changes</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="monthPickerModal">
  <div class="modal-sheet">
    <div class="m-head">Jump to a month</div>
    <div class="picker-year-nav">
      <div class="nav-arrow" id="pickerYearPrev">‹</div>
      <div class="py-val" id="pickerYearVal"></div>
      <div class="nav-arrow" id="pickerYearNext">›</div>
    </div>
    <div class="picker-months" id="pickerMonths"></div>
  </div>
</div>

<div class="modal-backdrop" id="nameDetailModal">
  <div class="modal-sheet">
    <div class="m-head" id="ndTitle">Name</div>
    <div class="nd-stat-block">
      <div class="nd-heading" id="ndMonthHeading">This month</div>
      <div class="nd-row"><div class="nd-k">Times logged</div><div class="nd-v" id="ndMonthCount">0</div></div>
      <div class="nd-row"><div class="nd-k">Total</div><div class="nd-v" id="ndMonthTotal">0</div></div>
      <div class="nd-row"><div class="nd-k">Share of the month</div><div class="nd-v" id="ndMonthPct">0%</div></div>
    </div>
    <div class="nd-stat-block">
      <div class="nd-heading">All time</div>
      <div class="nd-row"><div class="nd-k">Times logged</div><div class="nd-v" id="ndAllCount">0</div></div>
      <div class="nd-row"><div class="nd-k">Total</div><div class="nd-v" id="ndAllTotal">0</div></div>
      <div class="nd-row"><div class="nd-k">Share of all time</div><div class="nd-v" id="ndAllPct">0%</div></div>
    </div>
    <button class="cancel-btn" id="ndClose" style="width:100%;">Close</button>
  </div>
</div>

<div class="wrapped-overlay" id="wrappedOverlay">
  <button class="wrapped-close" id="wrappedClose">✕</button>
  <div class="wrapped-dots" id="wrappedDots"></div>
  <div class="wrapped-slide" id="wrappedSlide">
    <div class="wrapped-tap-zones">
      <div id="wrappedPrevZone"></div>
      <div id="wrappedNextZone"></div>
    </div>
  </div>
</div>

<script>
const CURRENCY = '₦';
let entries = [];
let currentType = 'spend';
let calMonth = new Date().getMonth(), calYear = new Date().getFullYear();
let splitMonth = new Date().getMonth(), splitYear = new Date().getFullYear();
let splitType = 'spend';
let selectedDay = null;
let editingId = null;

const $ = id => document.getElementById(id);
const todayStr = () => new Date().toISOString().slice(0,10);
const fmt = n => CURRENCY + Math.abs(n).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
const monthKey = (y,m) => y + '-' + String(m+1).padStart(2,'0');
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

async function loadEntries() {
  try {
    const raw = localStorage.getItem('ledger_entries');
    entries = raw ? JSON.parse(raw) : [];
  } catch (e) { entries = []; }
}
async function persistEntries() {
  try { localStorage.setItem('ledger_entries', JSON.stringify(entries)); }
  catch (e) { console.error('save failed', e); }
}

function uid() { return 'e' + Date.now() + Math.random().toString(36).slice(2,7); }

// ---------- Navigation ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});
function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  $('view-' + name).classList.add('active');
  if (name === 'calendar') renderCalendar();
  if (name === 'split') renderSplit();
  if (name === 'compare') renderCompare();
  if (name === 'curve') renderCurve();
}

// ---------- Add view ----------
$('toggleSpend').addEventListener('click', () => setType('spend'));
$('toggleIncome').addEventListener('click', () => setType('income'));
function setType(t) {
  currentType = t;
  $('toggleSpend').classList.toggle('active', t === 'spend');
  $('toggleIncome').classList.toggle('active', t === 'income');
  const btn = $('saveEntryBtn');
  btn.textContent = t === 'spend' ? 'Add spend' : 'Add income';
  btn.classList.toggle('income-mode', t === 'income');
}
$('inDate').value = todayStr();

$('saveEntryBtn').addEventListener('click', async () => {
  const amount = parseFloat($('inAmount').value);
  const name = $('inName').value.trim();
  const date = $('inDate').value || todayStr();
  if (!amount || amount <= 0 || !name) return;
  entries.push({ id: uid(), type: currentType, amount, name, date });
  await persistEntries();
  $('inAmount').value = ''; $('inName').value = '';
  $('inDate').value = todayStr();
  renderRecent();
});

function renderRecent() {
  const list = $('recentList');
  const sorted = [...entries].sort((a,b) => b.date.localeCompare(a.date) || 0);
  if (!sorted.length) { list.innerHTML = '<div class="empty-note">Nothing logged yet — add your first entry above.</div>'; return; }
  list.innerHTML = sorted.slice(0, 40).map(entryRowHtml).join('');
  attachRowHandlers(list);
}
function entryRowHtml(e) {
  return `<div class="entry-row" data-id="${e.id}">
    <div class="entry-dot ${e.type}"></div>
    <div class="entry-mid">
      <div class="entry-name">${escapeHtml(e.name)}</div>
      <div class="entry-date">${niceDate(e.date)}</div>
    </div>
    <div class="entry-amt ${e.type}">${e.type === 'spend' ? '-' : '+'}${fmt(e.amount)}</div>
    <div class="entry-actions">
      <button class="icon-btn edit-btn" title="Edit">✎</button>
      <button class="icon-btn del-btn" title="Delete">✕</button>
    </div>
  </div>`;
}
function attachRowHandlers(container) {
  container.querySelectorAll('.entry-row').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('.edit-btn').addEventListener('click', () => openEdit(id));
    row.querySelector('.del-btn').addEventListener('click', () => deleteEntry(id));
  });
}
async function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  await persistEntries();
  renderRecent(); renderCalendar(); renderSplit(); renderCompare(); renderCurve();
}
function niceDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ---------- Edit modal ----------
function openEdit(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  $('editAmount').value = e.amount;
  $('editName').value = e.name;
  $('editDate').value = e.date;
  $('editModal').classList.add('open');
}
$('editCancel').addEventListener('click', () => $('editModal').classList.remove('open'));
$('editSave').addEventListener('click', async () => {
  const e = entries.find(x => x.id === editingId);
  if (!e) return;
  const amount = parseFloat($('editAmount').value);
  const name = $('editName').value.trim();
  const date = $('editDate').value;
  if (!amount || amount <= 0 || !name || !date) return;
  e.amount = amount; e.name = name; e.date = date;
  await persistEntries();
  $('editModal').classList.remove('open');
  renderRecent(); renderCalendar(); renderSplit(); renderCompare(); renderCurve();
});

// ---------- Calendar ----------
$('calPrev').addEventListener('click', () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } selectedDay = null; renderCalendar(); });
$('calNext').addEventListener('click', () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } selectedDay = null; renderCalendar(); });

function renderCalendar() {
  $('calTitle').textContent = MONTH_NAMES[calMonth] + ' ' + calYear;
  const grid = $('calGrid');
  const wdNames = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  let html = wdNames.map(w => `<div class="cal-wd">${w}</div>`).join('');
  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const todayD = todayStr();
  for (let i = 0; i < firstDow; i++) html += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = monthKey(calYear, calMonth) + '-' + String(d).padStart(2,'0');
    const dayEntries = entries.filter(e => e.date === dateStr);
    const hasSpend = dayEntries.some(e => e.type === 'spend');
    const hasIncome = dayEntries.some(e => e.type === 'income');
    const classes = ['cal-day'];
    if (dayEntries.length) classes.push('has-activity');
    if (dateStr === todayD) classes.push('today');
    if (dateStr === selectedDay) classes.push('selected');
    let dots = '';
    if (hasSpend) dots += `<div class="cal-mini-dot" style="background:var(--clay)"></div>`;
    if (hasIncome) dots += `<div class="cal-mini-dot" style="background:var(--green-bright)"></div>`;
    html += `<div class="${classes.join(' ')}" data-date="${dateStr}">
      <div class="dnum">${d}</div>
      <div class="cal-dot-row">${dots}</div>
    </div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-day:not(.empty)').forEach(cell => {
    cell.addEventListener('click', () => { selectedDay = cell.dataset.date; renderCalendar(); renderDayPanel(); });
  });
  if (selectedDay) renderDayPanel(); else $('dayPanel').style.display = 'none';
}
function renderDayPanel() {
  const panel = $('dayPanel');
  const dayEntries = entries.filter(e => e.date === selectedDay);
  panel.style.display = 'block';
  $('dpTitle').textContent = niceDate(selectedDay) + (dayEntries.length ? '' : ' — nothing logged');
  $('dpList').innerHTML = dayEntries.map(entryRowHtml).join('');
  attachRowHandlers($('dpList'));
}

// ---------- Split ----------
let splitScope = 'month'; // 'month' | 'all'
$('splitPrev').addEventListener('click', () => { splitMonth--; if (splitMonth < 0) { splitMonth = 11; splitYear--; } renderSplit(); });
$('splitNext').addEventListener('click', () => { splitMonth++; if (splitMonth > 11) { splitMonth = 0; splitYear++; } renderSplit(); });
$('splitToggleSpend').addEventListener('click', () => { splitType = 'spend'; $('splitToggleSpend').classList.add('active'); $('splitToggleIncome').classList.remove('active'); renderSplit(); });
$('splitToggleIncome').addEventListener('click', () => { splitType = 'income'; $('splitToggleIncome').classList.add('active'); $('splitToggleSpend').classList.remove('active'); renderSplit(); });
$('scopeMonth').addEventListener('click', () => { splitScope = 'month'; $('scopeMonth').classList.add('active'); $('scopeAll').classList.remove('active'); $('splitMonthNav').style.display = 'flex'; renderSplit(); });
$('scopeAll').addEventListener('click', () => { splitScope = 'all'; $('scopeAll').classList.add('active'); $('scopeMonth').classList.remove('active'); $('splitMonthNav').style.display = 'none'; renderSplit(); });

const PALETTE = ['#b3875e','#a8664c','#6e4e30','#8a6a44','#62775a','#5c3a2c','#3a4634','#a99a88'];

function renderSplit() {
  const isAll = splitScope === 'all';
  const scopeEntries = isAll ? entries : entries.filter(e => e.date.startsWith(monthKey(splitYear, splitMonth)));
  const periodLabel = isAll ? 'all time' : (MONTH_NAMES[splitMonth] + ' ' + splitYear);
  $('splitTitle').textContent = MONTH_NAMES[splitMonth] + ' ' + splitYear;
  $('splitTotalLabel').textContent = 'Total, ' + periodLabel;
  $('monthListLabel').textContent = isAll ? 'Everything ever logged' : 'Everything logged this month';

  const periodSpend = scopeEntries.filter(e => e.type === 'spend').reduce((s,e) => s + e.amount, 0);
  const periodIncome = scopeEntries.filter(e => e.type === 'income').reduce((s,e) => s + e.amount, 0);
  const periodNet = periodIncome - periodSpend;

  const spanNote = isAll && scopeEntries.length
    ? (() => {
        const dates = scopeEntries.map(e => e.date).sort();
        return `<div class="hero-label" style="margin-top:2px;">${niceDate(dates[0])} → ${niceDate(dates[dates.length-1])}</div>`;
      })()
    : '';

  $('monthSummary').innerHTML = `
    <div class="ms-item"><div class="ms-label">Spent</div><div class="ms-val" style="color:var(--clay)">${fmt(periodSpend)}</div></div>
    <div class="ms-item"><div class="ms-label">Earned</div><div class="ms-val" style="color:var(--green)">${fmt(periodIncome)}</div></div>
    <div class="ms-item"><div class="ms-label">Net</div><div class="ms-val" style="color:${periodNet>=0?'var(--green)':'var(--clay)'}">${periodNet>=0?'+':'−'}${fmt(periodNet)}</div></div>
  ` + spanNote;

  const typeEntries = scopeEntries.filter(e => e.type === splitType);
  const total = typeEntries.reduce((s,e) => s + e.amount, 0);
  $('splitTotal').textContent = fmt(total);
  $('splitTotal').style.color = splitType === 'spend' ? 'var(--clay)' : 'var(--green)';

  const byName = {};
  typeEntries.forEach(e => { byName[e.name] = (byName[e.name] || 0) + e.amount; });
  const sorted = Object.entries(byName).sort((a,b) => b[1]-a[1]);

  if (!sorted.length) {
    $('donutEl').style.background = 'rgba(255,255,255,0.05)';
    $('legendEl').innerHTML = `<div class="empty-note" style="padding:6px 0;">No entries ${isAll ? 'yet' : 'this month'}.</div>`;
  } else {
    let gradParts = []; let acc = 0;
    const legendHtml = sorted.map(([name, amt], i) => {
      const pct = (amt/total)*100;
      const color = PALETTE[i % PALETTE.length];
      gradParts.push(`${color} ${acc}% ${acc+pct}%`);
      acc += pct;
      return `<div class="legend-row clickable" data-name="${escapeHtml(name)}"><div class="legend-sw" style="background:${color}"></div><div class="legend-name">${escapeHtml(name)}</div><div class="legend-pct">${pct.toFixed(0)}%</div></div>`;
    }).join('');
    $('donutEl').style.background = `conic-gradient(${gradParts.join(',')})`;
    $('donutEl').style.mask = 'radial-gradient(farthest-side, transparent calc(100% - 22px), black calc(100% - 22px))';
    $('donutEl').style.webkitMask = 'radial-gradient(farthest-side, transparent calc(100% - 22px), black calc(100% - 22px))';
    $('legendEl').innerHTML = legendHtml;
    $('legendEl').querySelectorAll('.legend-row.clickable').forEach(row => {
      row.addEventListener('click', () => openNameDetail(row.dataset.name, splitType));
    });
  }

  const monthListEl = $('monthList');
  const allSorted = [...scopeEntries].sort((a,b) => b.date.localeCompare(a.date));
  if (!allSorted.length) {
    monthListEl.innerHTML = `<div class="empty-note">Nothing logged ${isAll ? 'yet' : 'in this month'}.</div>`;
  } else {
    const capped = isAll ? allSorted.slice(0, 150) : allSorted;
    monthListEl.innerHTML = capped.map(entryRowHtml).join('');
    if (isAll && allSorted.length > 150) {
      monthListEl.innerHTML += `<div class="empty-note">Showing the 150 most recent of ${allSorted.length} entries.</div>`;
    }
    attachRowHandlers(monthListEl);
  }
}

// ---------- Name detail ----------
function openNameDetail(name, type) {
  const ofType = entries.filter(e => e.type === type);
  const allTotal = ofType.reduce((s,e) => s + e.amount, 0);
  const allMatches = ofType.filter(e => e.name === name);
  const allCount = allMatches.length;
  const allAmt = allMatches.reduce((s,e) => s + e.amount, 0);
  const allPct = allTotal ? (allAmt/allTotal*100) : 0;

  const mk = monthKey(splitYear, splitMonth);
  const monthOfType = ofType.filter(e => e.date.startsWith(mk));
  const monthTotal = monthOfType.reduce((s,e) => s + e.amount, 0);
  const monthMatches = monthOfType.filter(e => e.name === name);
  const monthCount = monthMatches.length;
  const monthAmt = monthMatches.reduce((s,e) => s + e.amount, 0);
  const monthPct = monthTotal ? (monthAmt/monthTotal*100) : 0;

  $('ndTitle').textContent = name;
  $('ndMonthHeading').textContent = MONTH_NAMES[splitMonth] + ' ' + splitYear;
  $('ndMonthCount').textContent = monthCount;
  $('ndMonthTotal').textContent = fmt(monthAmt);
  $('ndMonthPct').textContent = monthPct.toFixed(0) + '%';
  $('ndAllCount').textContent = allCount;
  $('ndAllTotal').textContent = fmt(allAmt);
  $('ndAllPct').textContent = allPct.toFixed(0) + '%';
  $('nameDetailModal').classList.add('open');
}
$('ndClose').addEventListener('click', () => $('nameDetailModal').classList.remove('open'));
$('nameDetailModal').addEventListener('click', (e) => { if (e.target.id === 'nameDetailModal') $('nameDetailModal').classList.remove('open'); });

// ---------- Wrapped ----------
let wrappedSlides = [];
let wrappedIndex = 0;

function buildWrappedSlides() {
  const isAll = splitScope === 'all';
  const scopeEntries = isAll ? entries : entries.filter(e => e.date.startsWith(monthKey(splitYear, splitMonth)));
  const periodLabel = isAll ? 'All time' : (MONTH_NAMES[splitMonth] + ' ' + splitYear);
  const spendEntries = scopeEntries.filter(e => e.type === 'spend');
  const incomeEntries = scopeEntries.filter(e => e.type === 'income');
  const totalSpend = spendEntries.reduce((s,e) => s + e.amount, 0);
  const totalIncome = incomeEntries.reduce((s,e) => s + e.amount, 0);
  const net = totalIncome - totalSpend;

  const slides = [];
  slides.push({ label: periodLabel.toUpperCase(), num: scopeEntries.length, sub: scopeEntries.length === 1 ? 'entry logged' : 'entries logged', tone: 'tan' });

  if (scopeEntries.length === 0) {
    slides.push({ label: 'Nothing logged yet', num: '', sub: 'Add a few entries and your Wrapped will fill up.', tone: 'tan' });
    return slides;
  }

  slides.push({ label: 'You spent', num: fmt(totalSpend), sub: spendEntries.length + ' spend ' + (spendEntries.length === 1 ? 'entry' : 'entries'), tone: 'clay' });
  slides.push({ label: 'You earned', num: fmt(totalIncome), sub: incomeEntries.length + ' income ' + (incomeEntries.length === 1 ? 'entry' : 'entries'), tone: 'green' });
  slides.push({ label: 'Net position', num: (net >= 0 ? '+' : '−') + fmt(net), sub: net >= 0 ? 'You came out ahead' : 'You spent more than you earned', tone: net >= 0 ? 'green' : 'clay' });

  const byNameSpend = {};
  spendEntries.forEach(e => { if (!byNameSpend[e.name]) byNameSpend[e.name] = { amt: 0, count: 0 }; byNameSpend[e.name].amt += e.amount; byNameSpend[e.name].count++; });
  const spendRanked = Object.entries(byNameSpend).sort((a,b) => b[1].amt - a[1].amt);
  if (spendRanked.length) {
    const [name, stat] = spendRanked[0];
    const pct = totalSpend ? (stat.amt/totalSpend*100) : 0;
    slides.push({ label: 'Your top spend', name, num: fmt(stat.amt), sub: `${pct.toFixed(0)}% of everything you spent, across ${stat.count} ${stat.count===1?'time':'times'}`, tone: 'clay' });
  }
  const freqRanked = Object.entries(byNameSpend).sort((a,b) => b[1].count - a[1].count);
  if (freqRanked.length && freqRanked[0][0] !== spendRanked[0][0]) {
    const [name, stat] = freqRanked[0];
    slides.push({ label: 'Your most frequent spend', name, num: stat.count + 'x', sub: `${fmt(stat.amt)} total on ${name}`, tone: 'clay' });
  }
  if (spendEntries.length) {
    const biggest = [...spendEntries].sort((a,b) => b.amount - a.amount)[0];
    slides.push({ label: 'Biggest single spend', name: biggest.name, num: fmt(biggest.amount), sub: niceDate(biggest.date), tone: 'clay' });
  }

  const byNameIncome = {};
  incomeEntries.forEach(e => { if (!byNameIncome[e.name]) byNameIncome[e.name] = { amt: 0, count: 0 }; byNameIncome[e.name].amt += e.amount; byNameIncome[e.name].count++; });
  const incomeRanked = Object.entries(byNameIncome).sort((a,b) => b[1].amt - a[1].amt);
  if (incomeRanked.length) {
    const [name, stat] = incomeRanked[0];
    const pct = totalIncome ? (stat.amt/totalIncome*100) : 0;
    slides.push({ label: 'Your top income source', name, num: fmt(stat.amt), sub: `${pct.toFixed(0)}% of everything you earned`, tone: 'green' });
  }

  slides.push({ label: "That's your wrap", num: '✨', sub: periodLabel + ' — done.', tone: 'tan' });
  return slides;
}

function toneColor(tone) { return tone === 'clay' ? 'var(--clay)' : tone === 'green' ? 'var(--green)' : 'var(--tan)'; }

function renderWrappedSlide() {
  const s = wrappedSlides[wrappedIndex];
  const slideEl = $('wrappedSlide');
  slideEl.innerHTML = `
    <div class="wrapped-tap-zones"><div id="wrappedPrevZone"></div><div id="wrappedNextZone"></div></div>
    <div class="ws-label" style="color:${toneColor(s.tone)}">${s.label}</div>
    ${s.name ? `<div class="ws-name">${escapeHtml(s.name)}</div>` : ''}
    <div class="ws-num" style="color:${toneColor(s.tone)}">${s.num}</div>
    <div class="ws-sub">${s.sub}</div>
  `;
  $('wrappedPrevZone').addEventListener('click', () => stepWrapped(-1));
  $('wrappedNextZone').addEventListener('click', () => stepWrapped(1));
  $('wrappedDots').querySelectorAll('.wd').forEach((d, i) => d.classList.toggle('done', i <= wrappedIndex));
}
function stepWrapped(dir) {
  wrappedIndex += dir;
  if (wrappedIndex < 0) wrappedIndex = 0;
  if (wrappedIndex >= wrappedSlides.length) { $('wrappedOverlay').classList.remove('open'); return; }
  renderWrappedSlide();
}
$('openWrapped').addEventListener('click', () => {
  wrappedSlides = buildWrappedSlides();
  wrappedIndex = 0;
  $('wrappedDots').innerHTML = wrappedSlides.map(() => `<div class="wd"><div class="wd-fill"></div></div>`).join('');
  renderWrappedSlide();
  $('wrappedOverlay').classList.add('open');
});
$('wrappedClose').addEventListener('click', () => $('wrappedOverlay').classList.remove('open'));

// ---------- Month/year picker ----------
let pickerTarget = 'split';
let pickerYear = new Date().getFullYear();
function openMonthPicker(target) {
  pickerTarget = target;
  pickerYear = target === 'split' ? splitYear : calYear;
  renderPicker();
  $('monthPickerModal').classList.add('open');
}
function renderPicker() {
  $('pickerYearVal').textContent = pickerYear;
  const activeMonth = pickerTarget === 'split' ? (pickerYear === splitYear ? splitMonth : -1) : (pickerYear === calYear ? calMonth : -1);
  $('pickerMonths').innerHTML = MONTH_NAMES.map((name, i) => {
    const short = name.slice(0,3);
    return `<button class="picker-month-btn ${i === activeMonth ? 'current' : ''}" data-m="${i}">${short}</button>`;
  }).join('');
  $('pickerMonths').querySelectorAll('.picker-month-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = parseInt(btn.dataset.m, 10);
      if (pickerTarget === 'split') { splitMonth = m; splitYear = pickerYear; renderSplit(); }
      else { calMonth = m; calYear = pickerYear; selectedDay = null; renderCalendar(); }
      $('monthPickerModal').classList.remove('open');
    });
  });
}
$('pickerYearPrev').addEventListener('click', () => { pickerYear--; renderPicker(); });
$('pickerYearNext').addEventListener('click', () => { pickerYear++; renderPicker(); });
$('splitTitle').addEventListener('click', () => openMonthPicker('split'));
$('calTitle').addEventListener('click', () => openMonthPicker('cal'));
$('monthPickerModal').addEventListener('click', (e) => { if (e.target.id === 'monthPickerModal') $('monthPickerModal').classList.remove('open'); });

// ---------- Compare ----------
function sumRange(startDate, endDate, type) {
  return entries.filter(e => e.date >= startDate && e.date <= endDate && e.type === type)
    .reduce((s,e) => s + e.amount, 0);
}
function renderCompare() {
  const now = new Date();
  const thisMonthStart = monthKey(now.getFullYear(), now.getMonth()) + '-01';
  const thisMonthEnd = todayStr();
  const lastM = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastMonthStart = monthKey(lastM.getFullYear(), lastM.getMonth()) + '-01';
  const lastMonthEndDate = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
  const lastMonthEnd = monthKey(lastM.getFullYear(), lastM.getMonth()) + '-' + String(lastMonthEndDate).padStart(2,'0');
  const threeM = new Date(now.getFullYear(), now.getMonth()-2, 1);
  const threeMonthStart = monthKey(threeM.getFullYear(), threeM.getMonth()) + '-01';

  const periods = [
    { label: 'This month', start: thisMonthStart, end: thisMonthEnd },
    { label: 'Last month', start: lastMonthStart, end: lastMonthEnd },
    { label: 'Last 3 months', start: threeMonthStart, end: thisMonthEnd },
  ];
  const results = periods.map(p => ({
    ...p,
    spend: sumRange(p.start, p.end, 'spend'),
    income: sumRange(p.start, p.end, 'income'),
  }));
  const maxVal = Math.max(1, ...results.flatMap(r => [r.spend, r.income]));

  $('compareHeroNet').textContent = (results[0].income - results[0].spend >= 0 ? '+' : '−') + fmt(results[0].income - results[0].spend);
  $('compareHeroNet').style.color = (results[0].income - results[0].spend) >= 0 ? 'var(--green-bright)' : 'var(--clay)';

  $('compareGrid').innerHTML = results.map(r => {
    const net = r.income - r.spend;
    return `<div class="compare-row">
      <div class="compare-label">${r.label}</div>
      <div class="compare-bars">
        <div class="cbar-track"><div class="cbar-fill income" style="width:${(r.income/maxVal*100).toFixed(1)}%"></div></div>
        <div class="cbar-track"><div class="cbar-fill spend" style="width:${(r.spend/maxVal*100).toFixed(1)}%"></div></div>
      </div>
      <div class="compare-net" style="color:${net>=0?'var(--green-bright)':'var(--clay)'}">${net>=0?'+':'−'}${fmt(net)}</div>
    </div>`;
  }).join('');
}

// ---------- Curve ----------
function renderCurve() {
  const sorted = [...entries].sort((a,b) => a.date.localeCompare(b.date));
  const svg = $('curveSvg');
  if (!sorted.length) {
    svg.innerHTML = '';
    $('curveHeroNet').textContent = fmt(0);
    return;
  }
  let running = 0;
  const points = sorted.map(e => { running += (e.type === 'income' ? e.amount : -e.amount); return { date: e.date, val: running }; });
  const totalNet = running;
  $('curveHeroNet').textContent = (totalNet >= 0 ? '+' : '−') + fmt(totalNet);
  $('curveHeroNet').style.color = totalNet >= 0 ? 'var(--green-bright)' : 'var(--clay)';

  const vals = points.map(p => p.val);
  const minV = Math.min(0, ...vals), maxV = Math.max(0, ...vals);
  const range = (maxV - minV) || 1;
  const W = 340, H = 180, pad = 8;
  const xStep = points.length > 1 ? (W - pad*2) / (points.length - 1) : 0;
  const toY = v => H - pad - ((v - minV) / range) * (H - pad*2);
  const coords = points.map((p,i) => [pad + i*xStep, toY(p.val)]);
  const zeroY = toY(0);

  const linePath = coords.map((c,i) => (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${coords[coords.length-1][0].toFixed(1)},${zeroY.toFixed(1)} L${coords[0][0].toFixed(1)},${zeroY.toFixed(1)} Z`;

  svg.innerHTML = `
    <defs>
      <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${totalNet>=0?'#62775a':'#a8664c'}" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="${totalNet>=0?'#62775a':'#a8664c'}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <line x1="0" y1="${zeroY.toFixed(1)}" x2="${W}" y2="${zeroY.toFixed(1)}" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="${areaPath}" fill="url(#curveFill)" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="${totalNet>=0?'#75906b':'#a8664c'}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  `;
}

// ---------- Init ----------
(async function init() {
  await loadEntries();
  renderRecent();
  renderCalendar();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
